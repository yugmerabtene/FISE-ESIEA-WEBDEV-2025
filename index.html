<!doctype html>
<!-- ============================================================
     Page d'accueil du site Gaming (démo Bootstrap)
     FISE ESIEA - Cours de Développement Web
     Utilisation : présente une vitrine de jeux avec grille responsive
     ============================================================ -->
<html lang="fr">
<head>
    <!-- Métadonnées : encodage UTF-8 et viewport pour responsive -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Compatibilité Internet Explorer (edge) -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Feuille de style personnalisée (hover sur les images) -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Bootstrap 5.3 CSS via CDN (grille, composants, utilitaires) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Gaming - Site de vente de jeux</title>
</head>
<body>

<!-- ==================== EN-TÊTE / NAVIGATION ==================== -->
<header>
    <!-- Barre de navigation responsive Bootstrap avec toggler mobile -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <!-- Marque / logo du site -->
            <a class="navbar-brand" href="#">Gaming Site</a>
            <!-- Bouton hamburger pour les écrans mobiles (data-bs-toggle = Bootstrap 5) -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Liens de navigation (collapse = masqué sur mobile, déplié sur desktop) -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- ==================== CONTENU PRINCIPAL ==================== -->
<main>
    <!-- Section d'introduction / héro -->
    <section class="container mt-5">
        <h1>Site de vente de jeux en ligne</h1>
        <p>Découvrez les derniers jeux et événements gaming !</p>
    </section>

    <!-- Grille de jeux mise en avant (responsive : 2 col mobile, 3 tablette, 6 desktop) -->
    <section class="container mt-5">
        <div class="row">
            <!-- Chaque jeu est encapsulé dans une colonne Bootstrap avec marge inférieure -->
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <!-- img-thumbnail = bordure arrondie Bootstrap / img-hover = effet zoom survol (CSS perso) -->
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu Valorant - FPS tactique">
            </div>
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu d'action - À venir">
            </div>
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu de stratégie - Nouveauté">
            </div>
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu de rôle - RPG">
            </div>
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu de simulation">
            </div>
            <div class="col-6 col-md-4 col-lg-2 mb-3">
                <img class="img-thumbnail img-hover w-100" src="assets/img/valoriant.jpeg" alt="Jeu multijoueur - Battle Royale">
            </div>
        </div>
        <!-- Note : les images proviennent d'Eneba (https://www.eneba.com) à titre d'exemple -->
    </section>
</main>

<!-- ==================== PIED DE PAGE ==================== -->
<footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Gaming Site. Tous droits réservés.</p>
</footer>

<!-- Script Bootstrap JS (Bundle = JS + Popper) nécessaire pour le menu hamburger et les composants interactifs -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
